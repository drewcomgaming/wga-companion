name: Region prices

on:
  schedule:
    - cron: "17 * * * *" # hourly
  workflow_dispatch:
    inputs:
      ruleset_id:
        description: "Ruleset id to read auctions through (blank = auto-discover)"
        required: false

permissions:
  contents: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build price pack
        env:
          BLIZZARD_CLIENT_ID: ${{ secrets.BLIZZARD_CLIENT_ID }}
          BLIZZARD_CLIENT_SECRET: ${{ secrets.BLIZZARD_CLIENT_SECRET }}
          WGA_REGION: us
          WGA_RULESET_ID: ${{ inputs.ruleset_id || vars.WGA_RULESET_ID }}
          WGA_OUT: dist/WGACompanion_Data
        run: python3 pricejob/build_prices.py

      - name: Package
        run: |
          cd dist
          zip -qr WGACompanion_Data.zip WGACompanion_Data
          ls -la

      - name: Publish to the prices-us release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view prices-us >/dev/null 2>&1; then
            gh release create prices-us --title "Region prices (US)" --latest=false \
              --notes "Hourly WoW Forever auction prices for WGA Companion. Download WGACompanion_Data.zip and unzip it into _forever_\\Interface\\AddOns\\."
          fi
          gh release upload prices-us dist/WGACompanion_Data.zip dist/summary.json --clobber
          gh release edit prices-us --notes "Hourly WoW Forever auction prices for WGA Companion. Last update: $(date -u '+%Y-%m-%d %H:%M UTC'). Download WGACompanion_Data.zip and unzip it into _forever_\\Interface\\AddOns\\ (replace the old folder), then /reload."
